<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Magnus Bergmark — Digital Product & Strategy Executive."
    />
    <title>Magnus Bergmark</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono&family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <section class="intro" aria-labelledby="name">
        <p class="eyebrow">WELCOME</p>
        <h1 id="name">MAGNUS BERGMARK</h1>
      </section>

      <section class="profile" aria-label="Introduction">
        <div class="profile-content">
          <img
            class="profile-photo"
            src="images/magnus-bergmark.jpg"
            alt="Portrait of Magnus Bergmark"
          />
          <p class="statement">
            Digital Product &amp; Strategy Executive
          </p>
          <button class="contact" id="contact-button" type="button">
            Contact
          </button>
        </div>
      </section>
    </main>
    <script>
      const contactButton = document.querySelector("#contact-button");

      contactButton.addEventListener("click", () => {
        const user = "magnus";
        const domain = "bergmark.se";
        window.location.href = `mailto:${user}@${domain}`;
      });
    </script>
  </body>
</html>
